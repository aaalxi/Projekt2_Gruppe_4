<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/Global.css}">
</head>
<body>
<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/index.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul> <!-- giving the wishlistId value with, to the getmapping in wish -->
            <li><a th:href="@{/wishlist/{userId}/showCreateWishlist(userId=${wishlistId})}" class="btn">&plus; Create Wishlist</a></li>
            <li><form th:action="@{/logout}" method="post">
                <button type="submit" class="login-btn">Log ud</button>
            </form></li>
        </ul>
    </nav>
</header>
<main class="main">
    <h1 th:text="${wishlist.title}">Title</h1>
    <div class="wish-actions">
        <!--        create new wish-->
        <a class="btn" th:href="@{/wish/{wishlistId}/showCreateWish(wishlistId=${wishlist.getWishlistId()})}">+ Create Wish</a>
        <!--        sort wishes by price:-->
        <a class="btn" th:href="@{/wishlist/{wishlistId}/showWishlistSortedByPrice(wishlistId=${wishlistId})}">Sort By Price</a>
        <!--        sort wishes by priority:-->
        <a class="btn" th:href="@{/wishlist/{wishlistId}/showWishlistSortedByPriority(wishlistId=${wishlistId})}">Sort By Priority</a>
    </div>

    <section>
<!--        show wishes-->
        <div class="wish-grid">
            <div class="wish-card" th:each="wish : ${wishes}">
                <h3 th:text="${wish.title}">Title</h3>
                <p th:text="${wish.description}">Description</p>

                <div class="wish-info">
                    <p th:text="${wish.price} + ' kr.'">Price</p>
                    <p th:text="'Amount: ' + ${wish.amount}">Amount</p>
                    <p th:text="'Priority: ' + ${wish.priority}">Priority</p>
                    <a th:href="${wish.productUrl}" th:if="${wish.productUrl}" target="_blank" rel="noopener">Go to shop</a>
                </div>

                <div class="wish-image">
                    <img th:src="${wish.imgUrl}" th:if="${wish.imgUrl}" alt="wish image">
                </div>

                <a class="btn" th:href="@{/wish/{wishId}/showEditWish(wishId=${wish.wishId})}">Edit Wish</a>
            </div>

            <div class="wish-card">
                <a class="btn" th:href="@{/wish/{wishlistId}/showCreateWish(wishlistId=${wishlist.getWishlistId()})}">+ Create Wish</a>
            </div>
        </div>
    </section>
        <div class="wish-actions">
            <form th:action="@{/wishlist/deleteWishlist}"
                  method="post"
                  th:object="${wishlist}"
                  onsubmit="return confirm('Your wishlist will be DELETED!')">
                <input type="hidden" th:field="*{wishlistId}">
                <button class="btn"
                        type="submit">Delete Wishlist</button>
            </form>
            <a class="btn" th:href="@{/profile}">Back to Profile</a>
        </div>
</main>

</body>
</html>
