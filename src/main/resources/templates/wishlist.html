<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/Global.css}">
</head>
<body>
<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/cloud.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul>
            <li><a th:href="@{/profile}" class="btn">Profile</a></li>
            <li><a th:href="@{/logout}" class="login-btn">Log Out</a></li>
        </ul>
    </nav>
</header>
<main class="main">
    <section class="">
        <h1 th:text="${wishlist.title}">Title</h1>
    </section>

    <section>
        <div class="wish" th:each="wish : ${wishes}">
            <h3 th:text="|Title: ${wish.title}|">Title</h3>
            <p th:text="|Description: ${wish.description}|">Description</p>
            <p th:text="|Price: ${wish.price} kr.|">Price</p>
            <p th:text="|Amount: ${wish.amount}|">Amount</p>
            <p th:text="|Priority: ${wish.priority}|">Priority</p>
            <p th:text="|Created Date: ${wish.createDate}|">Created Date</p>

            <div class="wish-image">
                <img th:src="${wish.imgUrl}" alt="wish image">
                <a th:href="${wish.productUrl}">Product Link</a>
            </div>
            <br>
            <br>
            <a class="btn" th:href="@{/wish/{wishId}/showEditWish(wishId=${wish.getWishId()})}">Edit Wish</a>
            <br>
            <br>
        </div>
    </section>

    <section class="">
        <a class="btn" th:href="@{/wish/{wishlistId}/showCreateWish(wishlistId=${wishlist.getWishlistId()})}">+ Create Wish</a>
    </section>
</main>

</body>
</html>
