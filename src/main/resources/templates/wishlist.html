<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/Global.css}">
</head>
<body>
<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/index.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul> <!-- giving the wishlistId value with, to the getmapping in wish -->
            <li><a th:href="@{/wishlist/{userId}/showCreateWishlist(userId=${wishlistId})}" class="btn">&plus; Create Wishlist</a></li>
            <li><form th:action="@{/logout}" method="post">
                <button type="submit" class="login-btn">Log ud</button>
            </form></li>
        </ul>
    </nav>
</header>
<main class="main">
    <section class="">
        <h1 th:text="${wishlist.title}">Title</h1>
    </section>

    <section>
<!--        sort wishes by price:-->
        <a class="btn" th:href="@{/wishlist/{wishlistId}/showWishlistSortedByPrice(wishlistId=${wishlistId})}">Sort By Price</a>
<!--        sort wishes by priority:-->
        <a class="btn" th:href="@{/wishlist/{wishlistId}/showWishlistSortedByPriority(wishlistId=${wishlistId})}">Sort By Priority</a>
        <a class="btn" th:href="@{/wishlist}"></a>
<!--        show wishes-->
        <div class="wish" th:each="wish : ${wishes}">
            <h4 th:text="|Title: ${wish.title}|">Title</h4>
            <p th:text="|Description: ${wish.description}|">Description</p>
            <p th:text="|Price: ${wish.price} kr.|">Price</p>
            <p th:text="|Amount: ${wish.amount}|">Amount</p>
            <p th:text="|Priority: ${wish.priority}|">Priority</p>
            <p th:text="|Created Date: ${wish.createDate}|">Created Date</p>

            <div class="wish-image">
                <img th:src="${wish.imgUrl}" alt="wish image">
                <a th:href="${wish.productUrl}">Product Link</a>
            </div>
            <a class="btn" th:href="@{/wish/{wishId}/showEditWish(wishId=${wish.getWishId()})}">Edit Wish</a>
        </div>
    </section>
    <section>
        <div class="wish">
            <a class="btn" th:href="@{/wish/{wishlistId}/showCreateWish(wishlistId=${wishlist.getWishlistId()})}">+ Create Wish</a>
        </div>

        <form th:action="@{/wishlist/deleteWishlist}"
              method="post"
              th:object="${wishlist}"
              onsubmit="return confirm('Your wishlist will be DELETED!')">
            <input type="hidden" th:field="*{wishlistId}">
            <button class="btn"
                    type="submit">Delete Wishlist</button>
        </form>
        <a class="btn" th:href="@{/profile}">Back to Profile</a>
    </section>

    <section>
        <h3>Share this wishlist</h3>
        <p>Enter the email of the user you want to share this Wishlist with.
            The user has to have an account </p>
        <form th:action="@{/wishlist/share}" method="get">
            <input type="hidden" name="wishlistId" th:value="${wishlistId}">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <button type="submit">Share this list</button>
        </form>
    </section>
</main>

</body>
</html>
