<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/Global.css}">
<!--    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">-->
</head>
<body>
<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/logo-icon.svg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul>
            <li><button class="btn btn-share" type="button" popovertarget="share-wishlist">Share Wishlist</button></li>
            <li><a th:href="@{/profile}" class="btn">Profile</a></li>
            <li><form th:action="@{/logout}" method="post">
                <button type="submit" class="login-btn">Log ud</button>
            </form></li>
        </ul>
    </nav>
</header>
<main class="main">
    <div class="wishlist-title">
        <h1 th:text="${wishlist.title}">Title</h1>
    </div>
    <div class="wish-actions">
        <!--        create new wish-->
        <button class="btn" type="button" popovertarget="new-wish">+ New Wish</button>
        <!--        sort wishes by price:-->
        <a class="btn btn-page" th:href="@{/wishlist/{wishlistId}/showWishlistSortedByPrice(wishlistId=${wishlist.wishlistId})}">Sort By Price</a>
        <!--        sort wishes by priority:-->
        <a class="btn btn-page" th:href="@{/wishlist/{wishlistId}/showWishlistSortedByPriority(wishlistId=${wishlist.wishlistId})}">Sort By Priority</a>
        <form th:action="@{/wishlist/deleteWishlist}"
              method="post"
              th:object="${wishlist}"
              onsubmit="return confirm('Your wishlist will be DELETED!')">
            <input type="hidden" th:field="*{wishlistId}">
            <button class="btn btn-delete" type="submit">DELETE Wishlist</button>
        </form>

    </div>


        <!--        show wishes-->
        <div class="wish-grid">
            <div class="wish-card" th:each="wish : ${wishes}">
                <div class="wish-priority"
                     th:title="'Priority ' + ${wish.priority} + ' out of 5'">
                    <span th:each="i : ${#numbers.sequence(1, 5)}"
                          th:text="${i <= wish.priority} ? '★' : '☆'"
                          th:classappend="${i <= wish.priority} ? 'star-filled' : 'star-empty'">★</span>
                </div>

                <details class="wish-title" th:if="${!#strings.isEmpty(wish.title)}">
                    <summary><h3 th:text="${wish.title}">Title</h3></summary>
                </details>

                <details class="wish-desc" th:if="${!#strings.isEmpty(wish.description)}">
                    <summary th:text="${wish.description}">Description</summary>
                </details>

                <div class="wish-info">
                    <span class="wish-price"
                          th:if="${wish.price != null}"
                          th:text="${#numbers.formatDecimal(wish.price, 1, 'POINT', 2, 'COMMA')} + ' kr.'">1.234,00 kr.</span>
                </div>

                <div class="wish-image" th:if="${!#strings.isEmpty(wish.imgUrl)}">
                    <img th:src="${wish.imgUrl}" alt="wish image">
                </div>

                <a class="shop-link"
                   th:href="${wish.productUrl}"
                   th:if="${!#strings.isEmpty(wish.productUrl)}"
                   target="_blank" rel="noopener">Go To Shop ↗</a>

                <div class="wish-card-actions">
                    <button class="btn btn-page" type="button"
                            th:attr="popovertarget='edit-wish-' + ${wish.wishId}">Edit Wish</button>

                    <form th:action="@{/wish/deleteWish}" method="post"
                          onsubmit="return confirm('Your wish will be DELETED!')">
                        <input type="hidden" name="wishId" th:value="${wish.wishId}">
                        <input type="hidden" name="wishlistId" th:value="${wish.wishlistId}">
                        <button class="btn btn-delete" type="submit">Delete Wish</button>
                    </form>
            </div>
                </div>

            <div class="wish-card wish-card-new">
                <div class="wish-card-actions">
                    <button class="btn" type="button" popovertarget="new-wish">+ New Wish</button>
                </div>
            </div>
        </div>

<!--New wish-->
    <div id="new-wish" popover class="modal">
        <form class="modal-form" th:action="@{/wish/createWish}" th:object="${wish}" method="post">
            <h2>New Wish</h2>
                <input type="hidden" th:field="*{wishlistId}">

                <label for="title" > Title </label>
                <input type="text" id="title" th:field="*{title}" required>

                <label for="description" > Description </label>
                <input type="text" id="description" th:field="*{description}">

                <label for="price" > Price </label>
                <input type="number" id="price" th:field="*{price}" step="0.01" min="0">

                <label for="priority" > Priority </label>
                <input type="text" id="priority" th:field="*{priority}">

                <input type="hidden" th:field="*{amount}">

                <label for="productUrl" > Product link </label>
                <input type="url" id="productUrl" th:field="*{productUrl}">

                <label for="imgUrl" > Image link </label>
                <input type="url" id="imgUrl" th:field="*{imgUrl}">

            <div class="modal-actions">
                <button class="btn btn-page" type="button"
                        popovertarget="new-wish" popovertargetaction="hide">Cancel</button>
                <button class="btn" type="submit">Add</button>
            </div>
        </form>
    </div>

<!--Share wishlist-->
    <div id="share-wishlist" popover class="modal-edits">
        <form class="modal-edits-form" th:action="@{/wishlist/share}" method="post" onsubmit="return confirm('Sure you wanna share?')">
            <h2>Share Wishlist</h2>
            <p>Enter the email of the user you want to share this Wishlist with.
                The user has to have an account 👇</p>

            <input type="hidden" name="wishlistId" th:value="${wishlistId}">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <div class="modal-edits-actions">
                <button class="btn btn-page" type="button"
                        popovertarget="share-wishlist" popovertargetaction="hide">Cancel</button>
                <button class="btn" type="submit">Share Wishlist</button>
            </div>
            <div class="share-message"
                 th:if="${shareMessage != null}"
                 th:text="${shareMessage}">
            </div>
        </form>
    </div>

<!--Edit wish-->
    <div th:each="wish : ${wishes}" th:id="'edit-wish-' + ${wish.wishId}" popover class="modal">
        <form class="modal-edits-form" th:action="@{/wish/editWish}" method="post"
              onsubmit="return confirm('Keep changes?')">
            <h2>Edit Wish</h2>

            <input type="hidden" name="wishId" th:value="${wish.wishId}">
            <input type="hidden" name="wishlistId" th:value="${wish.wishlistId}">
            <input type="hidden" name="amount" th:value="${wish.amount}">

            <label th:for="'edit-title-' + ${wish.wishId}">Title</label>
            <input type="text" th:id="'edit-title-' + ${wish.wishId}" name="title" th:value="${wish.title}" required>

            <label th:for="'edit-desc-' + ${wish.wishId}">Description</label>
            <input type="text" th:id="'edit-desc-' + ${wish.wishId}" name="description" th:value="${wish.description}">

            <label th:for="'edit-price-' + ${wish.wishId}">Price</label>
            <input type="number" th:id="'edit-price-' + ${wish.wishId}" name="price" th:value="${wish.price}" step="0.01" min="0">

            <label th:for="'edit-priority-' + ${wish.wishId}">Priority</label>
            <input type="number" th:id="'edit-priority-' + ${wish.wishId}" name="priority" th:value="${wish.priority}" min="0" max="5">

            <label th:for="'edit-url-' + ${wish.wishId}">Product link</label>
            <input type="url" th:id="'edit-url-' + ${wish.wishId}" name="productUrl" th:value="${wish.productUrl}">

            <label th:for="'edit-img-' + ${wish.wishId}">Image link</label>
            <input type="url" th:id="'edit-img-' + ${wish.wishId}" name="imgUrl" th:value="${wish.imgUrl}">

            <div class="modal-actions">
                <button class="btn btn-page" type="button"
                        th:attr="popovertarget='edit-wish-' + ${wish.wishId}" popovertargetaction="hide">Cancel</button>
                <button class="btn" type="submit">Save</button>
            </div>
        </form>
    </div>

    <div class="wish-actions">
        <a class="btn btn-back" th:href="@{/profile}">Back to Profile</a>
    </div>

</main>

</body>
</html>
