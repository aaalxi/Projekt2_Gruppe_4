<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Wish</title>
    <link rel="stylesheet" th:href="@{/Global.css}">
</head>
<body>
<main class="page">
    <section class="">
        <h1 th:text="${wish.getTitle()}">Title</h1>
    </section>
    <section class="">
        <form class="form-modify" th:action="@{/wish/editWish}" th:object="${wish}" method="post">
            <h1>Edit Wish</h1>

            <input type="hidden" th:field="*{wishId}">
            <input type="hidden" th:field="*{wishlistId}">


            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" required>

            <label for="description" >Description</label>
            <input type="text" id="description" th:field="*{description}">

            <label for="productUrl">Product Link</label>
            <input type="text" id="productUrl" th:field="*{productUrl}">

            <label for="price">Price</label>
            <input type="number" id="price" th:field="*{price}" step="00.1" min="00.0">

            <label for="wishAmount">Amount</label>
            <input type="number" id="wishAmount" th:field="*{amount}" step="1" min="1" required>

            <label for="imgUrl" >Image</label>
            <input type="url" id="imgUrl" th:field="*{imgUrl}">

            <label for="priority">Priority</label>
            <input type="number" id="priority" name="priority" step="1" max="5">

            <button class="btn" type="submit">Add Changes</button>
        </form>
    </section>

</main>

</body>
</html>
