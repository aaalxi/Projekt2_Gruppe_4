<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Wish</title>
    <link rel="stylesheet" th:href="@{/css/Global.css}">
</head>
<body>
<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/index.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul>
            <li><a th:href="@{/profile}" class="btn">Profile</a></li>
            <li><a th:href="@{/logout}" class="login-btn">Log Out</a></li>
        </ul>
    </nav>
</header>

<main class="main">

    <section class="">
        <div class="forms">
            <h1>Edit Wish</h1>
        </div>

        <div class="forms">
            <form th:action="@{/wish/editWish}" th:object="${wish}" method="post">
                <h1 th:text="${wish.getTitle()}">Title</h1>

                <input type="hidden" th:field="*{wishId}">
                <input type="hidden" th:field="*{wishlistId}">


                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}" required>

                <label for="description" >Description</label>
                <input type="text" id="description" th:field="*{description}">

                <label for="productUrl">Product Link</label>
                <input type="text" id="productUrl" th:field="*{productUrl}">

                <label for="price">Price</label>
                <input type="number" id="price" th:field="*{price}" step="0.01" min="0.00">

                <label for="wishAmount">Amount</label>
                <input type="number" id="wishAmount" th:field="*{amount}" step="1" min="1" required>

                <label for="imgUrl" >Image</label>
                <input type="url" id="imgUrl" th:field="*{imgUrl}">

                <label for="priority">Priority</label>
                <input type="number" id="priority" th:field="*{priority}" step="1" min="0" max="5">

                <button class="btn" type="submit">Add Changes</button>
            </form>
            <form
                  th:action="@{/wishlist/{wishlistId}/showWishlist(wishlistId=${wish.getWishlistId()})}"
                  onsubmit="return confirm('Your changes will NOT be stored!!')">
                <button class="btn" type="submit">Back</button>
            </form>
        </div>
    </section>


</main>

</body>
</html>
