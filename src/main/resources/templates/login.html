<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <title>Homepage</title>
</head>
<body>
<header>
  <a th:href="@{/}" class="company-logo-link">
    <img th:src="@{/img/cloud.jpg}" class="logo" alt="Company Logo">
  </a>
  <nav>
    <ul>
      <li><a th:href="@{/getCreateUser}" class="btn">Create User</a></li>
      <li><a th:href="@{/login}" class="login-btn">Log in</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="forms">
    <form th:action="@{/login}" method="post">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" value ="F26A@stud.ek.dk" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" value="1234" required>

      <button type="submit" class="btn">Log in</button>
    </form>
    <a th:href="@{/}" class="btn">Back</a>
  </div>
</main>
</body>
</html>
