<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>New User</title>
</head>
<body>

<header>
    <a th:href="@{/static}" class="company-logo-link">
        <img th:src="@{/img/index.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul>
            <li><a th:href="@{/getCreateUser}" class="btn">Create Account</a></li>
            <li><a th:href="@{/login}" class="login-btn">Log in</a></li>
        </ul>
    </nav>
</header>

<div class="main">

    <div class="forms">

        <h2>Create a New Account</h2>

        <form th:action="@{/postCreateUser}" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>


            <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" name="password" id="password" required>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <a th:href="@{/static}" class="btn">Back</a>
    </div>
</div>
<footer>
</footer>
</body>
</html>
