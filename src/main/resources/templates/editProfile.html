<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/Global.css}">
    <title>Edit profile</title>
</head>

<body>
<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/index.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul>
            <li><a th:href="@{/profile}" class="btn">Profile</a></li>
            <li><a th:href="@{/logout}" class="login-btn">Log Out</a></li>
        </ul>
    </nav>
</header>

<main class="main">
    <section class="">
        <h1 th:text="${profile.getName()}">Title</h1>
    </section>

    <section class="">
        <h1>Edit Profile</h1>
        <div class="wishlist-card">
        <form class="form-modify" th:action="@{/profile/editNameAndEmail}" th:object="${profile}" method="post">

            <label for="name">Name</label>
            <input type="text" id="name" th:field ="*{name}">

            <label for="email">Email</label>
            <input type="email" id="email" th:field ="*{email}">


            <button type="submit">Confirm Edit</button>
        </form>

        <a th:href="@{/profile}">Cancel</a>
        <p th:if="${error}" th:text="${error}"></p>
        </div>
    </section>

</main>
</body>
</html>
