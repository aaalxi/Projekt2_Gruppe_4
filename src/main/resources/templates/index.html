<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <title>Homepage</title>
</head>
<body>

<header>
    <a th:href="@{/}" class="company-logo-link">
        <img th:src="@{/img/cloud.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul>
            <li><a th:href="@{/getCreateUser}" class="btn">Create User</a></li>
            <li><a th:href="@{/login}" class="login-btn">Log in</a></li>
        </ul>
    </nav>
</header>

<div class="hero">
    <img th:src="@{/img/forIndex1.jpg}" alt="Homepage image">
    <div class="hero-text">
        <h1>Share the Things You Love</h1>
        <p>Create your own wishlist,
            add your favorite wishes,
            and share them with friends and family.
            Keep everything organized in one place and
            make it easier for your loved ones to find the
            perfect gift for every special occasion.</p>
        <a th:href="@{/getCreateUser}" class="btn">Create User</a>
    </div>
</div>

<footer>

</footer>

</body>
</html>
