<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/Globall.css}">
</head>
<body>
<main class="page">

    <form class="Create Wishlist" method="post" th:action="@{/wishlist/createWishlist}">
        <h1>New Wishlist</h1>
        <p class="muted">Fill in the details below.</p>

        <input type="hidden" name="userId" th:value="${userId}">

        <label for="title">Title</label>
        <input type="text" id="title" name="title">

        <button class="btn" type="submit">Create Wishlist</button>

        <a th:href="@{/profile}">Cancel</a>
    </form>

</main>

</body>
</html>
