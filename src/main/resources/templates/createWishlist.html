<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/Global.css}">
</head>
<body>
<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/cloud.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul>
            <li><a th:href="@{/profile}" class="btn">Profile</a></li>
            <li><a th:href="@{/login}" class="login-btn">Log Out</a></li>
        </ul>
    </nav>
</header>
<main class="main">

    <form class="forms" method="post" th:action="@{/wishlist/createWishlist}">
        <h1>New Wishlist</h1>
        <p class="muted">Fill in the details below.</p>

        <input type="hidden" name="userId" th:value="${userId}">

        <label for="title">Title</label>
        <input type="text" id="title" name="title">

        <button class="btn" type="submit">Create Wishlist</button>
    </form>
    <form class="forms"
          th:action="@{/profile}"
          onsubmit="return confirm('This wishlist will NOT be stored!!')">
        <button class="btn" type="submit">Back</button>
    </form>
</main>

</body>
</html>
