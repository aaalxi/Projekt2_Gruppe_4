<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Homepage</title>
</head>
<body>

<header>
    <nav>
        <ul> <!-- giving the wishlistId value with, to the getmapping in wish -->
            <li><a th:href="@{/wish/{wishlistId}/showCreateWish(wishlistId=${wishlistId})}" class="btn">&plus; Create a Wish</a></li>
            <li><a th:href="@{/login}" class="login-btn">Log out</a></li>
        </ul>
    </nav>
</header>

<section>
    <div class="profile-user-info">
        <img th:src="@{/img/userProfilePic.jpg}" class="logo" alt="User default picture">
        <p th:text="${user.name}"></p>

    </div>
</section>

<h1>Hej <span th:text="${user.name}">Bruger</span>!</h1>

<p th:text="${user.email}">email@example.com</p>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="loging-btn">Log ud</button>
</form>










<footer>
    <a th:href="@{/confirmDeleteUser}">Delete account</a>
</footer>
</body>
</html>
