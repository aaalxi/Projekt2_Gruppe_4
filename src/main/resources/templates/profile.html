<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <title>Homepage</title>
</head>
<body>

<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/index.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul> <!-- giving the wishlistId value with, to the getmapping in wish -->
            <li><a th:href="@{/wishlist/{userId}/showCreateWishlist(userId=${user.userId})}" class="btn">&plus; Create Wishlist</a></li>
            <li><form th:action="@{/logout}" method="post">
                <button type="submit" class="login-btn">Log ud</button>
            </form></li>
        </ul>
    </nav>
</header>

<section>
    <div class="standard">
        <h1>Overview of <span th:text="${user.name}"></span>'s Wishlists</h1>
    </div>
</section>

<h1>Hej <span th:text="${user.name}">Bruger</span>!</h1>

<p th:text="${user.email}">email@example.com</p>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="loging-btn">Log ud</button>
</form>

<div class="wish-grid">
    <div class="wishlist-card" th:each="wishlist : ${wishlists}">
        <h2 th:text="${wishlist.title}">Titel</h2>

        <div class="wishlist-card-actions">
            <a class="btn" th:href="@{/wishlist/{wishlistId}/showWishlist(wishlistId=${wishlist.wishlistId})}">See wishlist</a>

            <form th:action="@{/wishlist/deleteWishlist}" method="post"
                  onsubmit="return confirm('Your wishlist will be DELETED!')">
                <input type="hidden" name="wishlistId" th:value="${wishlist.wishlistId}">
                <button class="btn" type="submit">Delete wishlist</button>
            </form>
        </div>
    </div>

    <div class="wishlist-card wishlist-card-new">
        <div class="wishlist-card-actions">
            <a class="btn" th:href="@{/wishlist/{userId}/showCreateWishlist(userId=${user.userId})}">+ New Wishlist</a>
        </div>
    </div>
</div>

<footer>
    <a th:href="@{/profile/showEditNameAndEmail}">Edit profile</a>
    <a th:href="@{/confirmDeleteUser}">Delete account</a>
</footer>
</body>
</html>
