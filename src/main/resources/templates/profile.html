<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Homepage</title>
</head>
<body>

<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/cloud.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul> <!-- giving the wishlistId value with, to the getmapping in wish -->
            <li><a th:href="@{/wishlist/{userId}/showCreateWishlist(userId=${user.getUserId})}" class="btn">&plus; Create a Wishlist</a></li>
            <li><a th:href="@{/logout}" class="login-btn">Log Out</a></li>
        </ul>
    </nav>
</header>

<section>
    <div class="profile-user-info">
        <img th:src="@{/img/userProfilePic.jpg}" class="logo" alt="User default picture">
        <p th:text="${user.name}"></p>

    </div>
</section>

<h1>Hej <span th:text="${user.name}">Bruger</span>!</h1>

<p th:text="${user.email}">email@example.com</p>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="loging-btn">Log ud</button>
</form>

<div class="wishlist-grid">
    <div class="wishlist-card" th:each="wishlist : ${wishlists}">
        <h2 th:text="${wishlist.title}"> Titel </h2>
        <a th:href="@{/wishlist/{wishlistId}/showWishlist(wishlistId=${wishlist.wishlistId})}" class="btn">Se ønskeliste</a>
    </div>

    <div class="wishlist-card">
        <p>Opret wishlist</p>
        <a th:href="@{/wishlist/{userId}/showCreateWishlist(userId=${user.userId})}" class="btn">+</a>
    </div>

</div>










<footer>
    <a th:href="@{/confirmDeleteUser}">Delete account</a>
</footer>
</body>
</html>
