<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Homepage</title>
</head>
<body>

<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/index.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul> <!-- giving the wishlistId value with, to the getmapping in wish -->
            <li><a th:href="@{/wishlist/{userId}/showCreateWishlist(userId=${user.getUserId})}" class="btn">&plus; Create Wishlist</a></li>
            <li><form th:action="@{/logout}" method="post">
                <button type="submit" class="login-btn">Log ud</button>
            </form></li>
        </ul>
    </nav>
</header>

<section>
    <div class="standard">
        <h1>Overview of <span th:text="${user.name}"></span>'s Wishlists</h1>
    </div>
</section>

<div class="wishlist-grid">
    <div class="wishlist-card" th:each="wishlist : ${wishlists}">
        <h2 th:text="${wishlist.title}"> Titel </h2>
        <a th:href="@{/wishlist/{wishlistId}/showWishlist(wishlistId=${wishlist.wishlistId})}" class="btn">See wishlist</a>

        <form th:action="@{/wishlist/deleteWishlist}"
              method="post"
              onsubmit="return confirm('Your wishlist will be DELETED!')">
            <input type="hidden" name="wishlistId" th:value="${wishlist.wishlistId}">
            <button class="btn"
                    type="submit">Delete Wishlist</button>
        </form>
    </div>

    <div class="wishlist-card">
        <p>Create wishlist</p>
        <a th:href="@{/wishlist/{userId}/showCreateWishlist(userId=${user.userId})}" class="btn">+</a>
    </div>
</div>

<footer>
    <a th:href="@{/confirmDeleteUser}">Delete account</a>
</footer>
</body>
</html>
