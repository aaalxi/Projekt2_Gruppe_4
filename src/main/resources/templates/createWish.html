<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Create Wish </title>
    <link rel="stylesheet" th:href="@{/css/Global.css}">
</head>


<body>
<h1>Create Wish</h1>

<form class="form-modify" th:action="@{/wish/createWish}" th:object="${wish}" method="post">

    <input type="hidden" th:field="*{wishlistId}">

    <label for="title" > Title </label>
    <input type="text" id="title" th:field="*{title}" required>

    <label for="price" > Price </label>
    <input type="number" id="price" th:field="*{price}" step="0.01" min="0">

    <label for="amount" > Amount </label>
    <input type="number" id="amount" th:field="*{amount}" min="1" required>

    <label for="productUrl" > Product link </label>
    <input type="url" id="productUrl" th:field="*{productUrl}">

    <label for="description" > Description </label>
    <input type="text" id="description" th:field="*{description}" required>

    <label for="imgUrl" > Image </label>
    <input type="url" id="imgUrl" th:field="*{imgUrl}">

    <button type="submit">Create</button>
</form>
</body>
</html>
