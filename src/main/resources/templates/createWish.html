<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Create Wish </title>
    <link rel="stylesheet" th:href="@{/css/Global.css}">
</head>
<body>
<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/index.jpg}" class="logo" alt="Company Logo">
    </a>
    <nav>
        <ul>
            <li><a th:href="@{/profile}" class="btn">Profile</a></li>
            <li><a th:href="@{/logout}" class="login-btn">Log Out</a></li>
        </ul>
    </nav>
</header>
    <h1>Create Wish</h1>

    <div class="main">

        <form class="forms" th:action="@{/wish/createWish}" th:object="${wish}" method="post">
            <input type="hidden" th:field="*{wishlistId}">

            <label for="title" > Title </label>
            <input type="text" id="title" th:field="*{title}" required>

            <label for="price" > Price </label>
            <input type="number" id="price" th:field="*{price}" step="0.01" min="0">

            <label for="amount" > Amount </label>
            <input type="number" id="amount" th:field="*{amount}" min="1" required>

            <label for="productUrl" > Product link </label>
            <input type="url" id="productUrl" th:field="*{productUrl}">

            <label for="description" > Description </label>
            <input type="text" id="description" th:field="*{description}">

            <label for="imgUrl" > Image link </label>
            <input type="url" id="imgUrl" th:field="*{imgUrl}">

            <button type="submit" class="btn">Create</button>
        </form>

        <form class="forms"
              th:action="@{/profile}"
              onsubmit="return confirm('This wish will NOT be stored!!')">
            <button class="btn" type="submit">Back</button>
        </form>
    </div>
</body>
</html>
