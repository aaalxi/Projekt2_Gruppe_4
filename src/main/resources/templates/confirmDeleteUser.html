<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <title>Confirm delete of User</title>
</head>
<body>
<header>
    <a th:href="@{/profile}" class="company-logo-link">
        <img th:src="@{/img/logo-icon.svg}" class="logo" alt="Company Logo">
    </a>
</header>

<main>
    <h1>Delete Account</h1>
    <p class="danger-zone">
        DANGER ZONE: All your Wishlists will be deleted.
    </p>

    <p>
        Enter your password to confirm that you want to delete your account.
    </p>
    <div class="modal-edits">
        <div class="modal-edits-form">
            <form th:action="@{/deleteUser}" onsubmit="return confirm('!!!! You account will be DELETED !!!!!')" method="post">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <div class="modal-edits-actions">
                    <button class="btn btn-delete" type="submit">DELETE</button>
                    <a class="btn" th:href="@{/profile}">Cancel</a>
                </div>
            </form>
            <p th:if="${error}" th:text="${error}"></p>
        </div>
    </div>
</main>
</body>
</html>
